name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-unit-tests:
    name: C unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure headless C targets
        run: cmake -S . -B build -DBUILD_GUI=OFF

      - name: Build C unit tests
        run: cmake --build build --config Release --target test_nn

      - name: Run C unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q main.py python tests benchmark

  python-c-parity:
    name: Python/C numerical parity (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Train reference checkpoint
        run: python python/train.py

      - name: Export weights for C inference
        run: python python/export.py

      - name: Run numerical parity regression test
        run: python tests/test_parity.py
